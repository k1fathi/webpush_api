version: "3.8"

services:
  db:
    image: postgres:15
    container_name: webpush_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/ensure-postgres-data.sh:/docker-entrypoint-initdb.d/00-ensure-postgres-data.sh:ro
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webpush}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: always
    command: postgres -c 'max_connections=100' -c 'shared_buffers=256MB' -c 'autovacuum=on'
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-webpush}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webpush_api
    volumes:
      - .:/app:delegated
      - ./scripts:/app/scripts:ro
      - static_files:/app/static
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-webpush}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    entrypoint:
      [
        "python",
        "-m",
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  redis:
    image: redis:6-alpine
    container_name: webpush_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --protected-mode yes
    security_opt:
      - no-new-privileges:true

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: webpush_rabbitmq
    volumes:
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    security_opt:
      - no-new-privileges:true

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webpush_celeryworker
    volumes:
      - .:/app:ro # Mount as read-only
    environment:
      PYTHONPATH: /app
      SKIP_PERMISSION_CHECKS: "true" # Skip permission checks
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:3
    security_opt:
      - no-new-privileges:true
    user: app # Explicitly set the user to match Dockerfile
    entrypoint:
      [
        "celery",
        "-A",
        "workers.celery_worker:celery_app",
        "worker",
        "--loglevel=${LOG_LEVEL:-INFO}",
      ]

volumes:
  postgres_data:
    name: webpush_postgres_data
  static_files:
    name: webpush_static_files
