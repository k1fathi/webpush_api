services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/ensure-postgres-data.sh:/docker-entrypoint-initdb.d/ensure-postgres-data.sh
      - ./scripts/pgsql_security.sh:/docker-entrypoint-initdb.d/01-pgsql_security.sh
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    restart: always
    command: postgres -c 'max_connections=100' -c 'shared_buffers=256MB' -c 'autovacuum=on' -c 'log_statement=all'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 20s
    user: postgres

  web:
    build: .
    volumes:
      - .:/app:delegated
      - ./scripts:/app/scripts:ro
      - static_files:/app/static
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - SQL_QUERY_TIMEOUT=5
      - MAX_QUERY_COMPLEXITY=100
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  redis:
    image: redis:6
    volumes:
      - ./scripts/redis_security.sh:/usr/local/bin/redis_security.sh
    ports:
      - "${REDIS_PORT}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      [
        "/bin/sh",
        "-c",
        "chmod +x /usr/local/bin/redis_security.sh && /usr/local/bin/redis_security.sh && redis-server --requirepass ${REDIS_PASSWORD:-redis} --protected-mode yes",
      ]

  rabbitmq:
    image: rabbitmq:3-management
    volumes:
      - ./config/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 5

  celery_worker:
    build: .
    command: celery -A workers.celery_worker:celery_app worker --loglevel=${LOG_LEVEL}
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure:3

volumes:
  postgres_data:
    name: webpush_postgres_data
  app_data:
    driver: local
  static_files:
    driver: local
